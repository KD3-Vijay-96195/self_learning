<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
</head>
<body>
    <h2>Signup Page</h2>
    
    <label class="form-label">name</label>
    <input type="text" style="width: 50%;" id="inputName" class="form-control" placeholder="Enter name">

    <label class="form-label">Email</label>
    <input type="email" style="width: 50%;" id="inputEmail" class="form-control" placeholder="Enter email">

    <label class="form-label">Password</label>
    <input type="password" style="width: 50%;" id="inputPassword" class="form-control" placeholder="Enter password">

    <label class="form-label">Mobile</label>
    <input type="tel" style="width: 50%;" id="inputMobile" class="form-control" placeholder="Enter Mobile">

    <br>
    <button type="button" class="btn btn-success">Signup</button>
    <button type="button" class="btn btn-danger">Cancel</button>
</body>
</html>
